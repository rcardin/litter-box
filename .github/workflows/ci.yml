name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job below writes anything back (no push, no release, no registry, no PR comment; the `testkit`
# job's `publish local` writes to the runner's own `~/.ivy2/local` and nowhere else), so all three
# read contents only from the top rather than inheriting the repository default, which is commonly
# read and write on contents and would hand that scope to the assembly smoke job's freshly built
# binary for no reason it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The suite runs entirely over the in-memory handlers in test/Recorder.scala: no Docker, no
      # `gh`, no Claude credentials. The Docker-dependent scripts under sandbox/test/ stay manual.
      - uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1.3.9
        with:
          jvm: temurin:21
          apps: scala-cli

      - run: scala-cli test .

  assembly-smoke:
    runs-on: ubuntu-latest
    # `.github/workflows/release.yml` is the one place `--assembly` used to be built at all, and a
    # tag push is the one path in this whole pipeline that cannot simply be retried: a release cut
    # from a broken assembly needs the tag deleted and recreated to try again. Building and smoke
    # testing the assembly on every PR catches that class of break while it is still cheap to fix,
    # at the cost of one extra `scala-cli --power package` per PR. Kept cheap on purpose: this runs
    # on the same scala-cli equipped runner as `test`, unlike release.yml's own `smoke` job, which
    # goes further and proves the binary runs on a machine with only a JDK on PATH; that stronger
    # claim stays release-only, since it is the tag path this job exists to protect, not restate.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1.3.9
        with:
          jvm: temurin:21
          apps: scala-cli

      - run: scala-cli --power package . --assembly -o litter-box --force

      - run: chmod +x litter-box

      - run: ./litter-box --help

      # `--help` reads no embedded resource (Main.scala answers Command.Help before any resource
      # read touches the classpath); `init` is the subcommand that actually reads scaffold/*, so
      # running it against a fresh directory and asserting the scaffold landed is what would catch
      # `resources/` falling out of the packaged jar, the way `--help` alone could not.
      - name: litter-box init in a fresh directory
        run: |
          bin="$PWD/litter-box"
          work="$(mktemp -d)"
          cd "$work"
          git init -q .
          "$bin" init
          test -f .litter-box/config.conf
          test -f .litter-box/Dockerfile
          test -f .litter-box/loop.scala
          test -f .litter-box/prompts/conventions.md
          test -f .litter-box/allowlist
          test -f .litter-box/.env.example
          test -f .litter-box/.gitignore
          # `litter-box run --dry-run` is not exercised here either, for the same reason
          # release.yml's own `smoke` job gives: it needs a real `claude` binary on PATH and a
          # real credential before Main.scala's preflight lets it reach its own dry-run stop
          # point, and faking either would not prove anything the in-memory test suite has not
          # already asserted.

  testkit:
    # The testkit artifact (issue #42) is `test/Recorder.scala` compiled ALONE against the published
    # library, and `scala-cli test .` in the `test` job above cannot fail the way that compile can:
    # inside the suite that file sits next to `src/` and next to scalatest, so an `org.scalatest`
    # import, or a reference to a helper defined in some spec, would compile perfectly here and break
    # only `release.yml`'s testkit publish. That is the one path in this whole pipeline with no retry,
    # since Maven Central is immutable at a version. This job runs the release's own compile on every
    # PR, where the fix is free.
    #
    # Its own job rather than a step bolted onto `test` or `assembly-smoke`: it needs neither's output
    # and runs in parallel with both, so it costs wall clock nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1.3.9
        with:
          jvm: temurin:21
          apps: scala-cli

      # The same commands `release.yml`'s publish job runs, minus the upload: stage the library into
      # `~/.ivy2/local` (which scala-cli resolves by default), then publish the testkit there too,
      # against it. `publish local` rather than `compile` for the testkit, for the reason that job
      # states at more length: `compile` builds no doc jar, no sources jar and no pom and reads none
      # of the metadata flags, so it would miss exactly the failures that are unrecoverable on a tag.
      #
      # `--scala`/`--jvm` come out of project.scala rather than being retyped, since an explicit file
      # input does not read that file, and `:?` fails the job on an EMPTY capture, which `set -u`
      # does not catch and scala-cli silently replaces with its own default version.
      #
      # `0.0.0-CI` rather than a real version, so nothing here can be mistaken for, or shadow, a
      # version that was actually released; release.yml uses the tag instead.
      - name: the testkit publishes standalone against the library
        run: |
          set -euo pipefail
          scala_version="$(sed -n 's|^//> using scala \(.*\)$|\1|p' project.scala)"
          jvm_version="$(sed -n 's|^//> using jvm \(.*\)$|\1|p' project.scala)"
          : "${scala_version:?no //> using scala directive found in project.scala}"
          : "${jvm_version:?no //> using jvm directive found in project.scala}"
          scala-cli --power publish local . \
            --organization in.rcard \
            --name litter-box \
            --project-version 0.0.0-CI
          scala-cli --power publish local test/Recorder.scala \
            --scala "$scala_version" \
            --jvm "$jvm_version" \
            --organization in.rcard \
            --name litter-box-testkit \
            --project-version 0.0.0-CI \
            --dep in.rcard::litter-box:0.0.0-CI \
            --license MIT \
            --url https://github.com/rcardin/litter-box \
            --vcs github:rcardin/litter-box \
            --description "Testkit for litter-box: scripted in-memory handlers for every capability, plus the interaction recorder, so a node author tests their own graph with no Docker, no network and no credentials." \
            --developer "rcardin|Riccardo Cardin|https://github.com/rcardin"
